quarkus.application.name=smart-parking
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Database (override with env in Docker / cloud)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:parking}
quarkus.datasource.password=${DB_PASSWORD:parking}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/smartparking}
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=db/migration

# JWT
mp.jwt.verify.publickey.location=jwt/publicKey.pem
mp.jwt.verify.issuer=${JWT_ISSUER:smart-parking}
smallrye.jwt.sign.key.location=jwt/privateKey.pem
smallrye.jwt.new-token.issuer=${JWT_ISSUER:smart-parking}
smallrye.jwt.new-token.lifespan=28800

# OpenAPI / Swagger
quarkus.smallrye-openapi.info-title=Smart Parking API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Parking slots, bookings, vehicles, entry/exit, and dashboards
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger
quarkus.smallrye-openapi.path=/q/openapi
quarkus.http.auth.proactive=true
quarkus.http.auth.permission.public.paths=/api/auth/register,/api/auth/login,/q/*,/swagger,/swagger/*,/q/openapi
quarkus.http.auth.permission.public.policy=permit
quarkus.jackson.write-dates-as-timestamps=false

# Health & metrics (Micrometer Prometheus at /q/metrics)
quarkus.smallrye-health.root-path=/q/health

# CORS for Angular (local + docker frontend)
quarkus.http.cors=true
quarkus.http.cors.origins=${FRONTEND_ORIGIN:http://localhost:4200,http://localhost:8088}
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,PUT,POST,DELETE,PATCH,OPTIONS
quarkus.http.cors.access-control-allow-credentials=true

# Dev
%dev.quarkus.hibernate-orm.log.sql=true

# Tests use in-memory H2 (PostgreSQL compatibility mode)
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:parking;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.flyway.enabled=false
%test.quarkus.flyway.migrate-at-start=false
